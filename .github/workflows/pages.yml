name: Deploy LMSScanKit-Web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK
        run: npm run build

      - name: Assemble static site
        run: |
          rm -rf _site
          mkdir -p _site/demo _site/dist _site/fixtures
          mkdir -p _site/node_modules/zxing-wasm/dist/es _site/node_modules/zxing-wasm/dist/reader
          cp index.html _site/index.html
          cp README.md _site/README.md
          cp -R demo/. _site/demo/
          cp -R dist/. _site/dist/
          cp -R fixtures/. _site/fixtures/
          cp -R node_modules/zxing-wasm/dist/es/. _site/node_modules/zxing-wasm/dist/es/
          cp node_modules/zxing-wasm/dist/reader/zxing_reader.wasm _site/node_modules/zxing-wasm/dist/reader/
          if [ -f CNAME ]; then cp CNAME _site/CNAME; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
